# Fan map of the bks fitacf++ scan at 03:30 UT: velocity and the conventional ground-scatter flag.
# Needs the demo output first:  make median-demo
# Run:  make plot-fov CONFIG=configs/plot_fov_demo.toml
[plot]
inputs = ["data/outputs/demo/bks/bks_202502080300_202502080400.pp.nc"]   # the .nc has gflg_conv; the .fitacf.pp.bz2 does not (extra_fields = false)
time   = 2025-02-08T03:30:00
params = ["v", "gflg_conv"]
coords = "geo"
out    = "data/figures/demo"
name   = "fov_bks_0330_fitacfpp"
