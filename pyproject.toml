[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amgeo-sd"
dynamic = ["version"]  # single source: amgeo_sd.__version__
description = "SuperDARN high-confidence scatter classification (fitacf++) for AMGeO"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Shibaji Chakraborty" }]
keywords = ["SuperDARN", "fitacf", "ionosphere", "ground scatter", "radar", "AMGeO"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
# Lower bounds are the versions the code is written against (not tested below them).
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "xarray>=2023.10",
    "netCDF4>=1.6",
    "matplotlib>=3.8",
    "cartopy>=0.22",
    "loguru>=0.7",
    "python-dateutil>=2.8",
    "pydarn>=4.3",
    "pydarnio>=2.1",
    "aacgmv2>=2.6",
]

[project.urls]
Homepage = "https://github.com/shibaji7/AMGeO-SD"
Documentation = "https://github.com/shibaji7/AMGeO-SD/blob/main/docs/README.md"
Issues = "https://github.com/shibaji7/AMGeO-SD/issues"

[project.scripts]
amgeo-sd = "amgeo_sd.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "build"]

[tool.setuptools.dynamic]
version = { attr = "amgeo_sd.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amgeo_sd = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:numpy.ndarray size changed:RuntimeWarning"]
markers = ["realdata: needs .fitacf files in tests/data (skipped when absent)"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Ported unchanged from the legacy code base (DaViTPy-derived geometry): kept in their original style.
extend-exclude = ["_bkp", "src/amgeo_sd/geo/geopack.py", "src/amgeo_sd/geo/fov.py", "src/amgeo_sd/geo/vheight.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D100", "D101", "D102", "D103"]  # D1xx: missing docstrings
ignore = ["E501"]  # long lines are left to the formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "B011"]
"examples/*" = ["D", "E402"]  # scripts: no docstring rule; imports after matplotlib.use() are intended
"src/amgeo_sd/__main__.py" = ["D100"]

[tool.ruff.lint.isort]
known-first-party = ["amgeo_sd"]
known-local-folder = ["common"]
