name: amgeo
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - xarray
  - netcdf4
  - loguru
  - pyyaml
  - python-dateutil
  - cartopy
  - shapely
  - pytest
  - pytest-cov
  - ruff
  - pip
  - pip:
      - pydarn>=4.3
      - pydarnio>=2.1
      - aacgmv2
      - -e .
