name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # the "Run workflow" button on the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the package with the development tools
        run: pip install "setuptools>=77" && pip install -e ".[dev]"
      - name: Lint and format check
        run: |
          ruff check src tests examples
          ruff format --check src tests
      - name: Tests (the real-data tests skip: tests/data is not in the repository)
        run: pytest -q
      - name: Generated documentation is up to date
        run: |
          python -m amgeo_sd params | diff - docs/PARAMETERS.md
          python -m amgeo_sd api --out "$RUNNER_TEMP/docs" > /dev/null
          diff -r "$RUNNER_TEMP/docs/api" docs/api
          diff "$RUNNER_TEMP/docs/API.md" docs/API.md

  install:
    # What a user does: build a wheel, install it in an empty environment (outside the checkout), run the command.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the wheel
        run: |
          pip install build
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
      - name: Run the installed command
        working-directory: ${{ runner.temp }}
        run: |
          ./venv/bin/amgeo-sd --help
          ./venv/bin/amgeo-sd init-config -o my.toml
          ./venv/bin/python -c "import amgeo_sd, amgeo_sd.plotting, amgeo_sd.pipelines; print(amgeo_sd.__version__)"
